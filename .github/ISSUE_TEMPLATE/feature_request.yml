name: 💡 Feature Request
description: Propose a new feature, metric, or improvement for NeedRadar
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement for community action and unmet needs intelligence!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or unmet civic workflow?
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / Visual Concept
      description: Describe your proposed solution or how the user experience should behave.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: Any alternative solutions or features you've considered?
